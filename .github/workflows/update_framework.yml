name: update framework

# Replaces system/ with the one of a chosen ColdIgniter version and opens
# a pull request. The site changes only when that pull request is merged.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ColdIgniter version to take: a tag (v4.1.0), a branch (trunk) or a commit"
        required: true
        default: trunk

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-framework
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ColdIgniter/coldigniter
          ref: ${{ inputs.ref }}
          path: _framework
          fetch-depth: 0
          persist-credentials: false
      - name: Copy system/ and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMEWORK_REF: ${{ inputs.ref }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          old=$(sed -n 's/^commit=//p' .coldigniter-version)
          new=$(git -C _framework rev-parse HEAD)
          version=$(sed -n 's/.*this\.CI_VERSION = "\([^"]*\)".*/\1/p' _framework/system/ColdIgniter.cfc)
          if [ -z "$version" ]; then
            echo "::error::no CI_VERSION in system/ColdIgniter.cfc of $FRAMEWORK_REF"
            exit 1
          fi
          if [ "$old" = "$new" ]; then
            echo "The site already has ColdIgniter $version ($new)."
            exit 0
          fi

          short=$(printf '%s' "$new" | cut -c1-7)
          branch="framework/$short"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$branch?expand=1"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::warning::the branch $branch is already there, nothing was changed"
            echo "The branch \`$branch\` is already there: $compare" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Files of the starter application that changed in ColdIgniter.
          # The site has its own copies, so these are merged by hand. The
          # old commit can be missing from the history of the new one.
          compared=yes
          starter=
          if [ -n "$old" ] && git -C _framework cat-file -e "$old^{commit}" 2> /dev/null; then
            starter=$(git -C _framework diff --name-only "$old" "$new" -- app public env)
          else
            compared=no
          fi

          rsync -a --delete _framework/system/ system/
          printf 'version=%s\ncommit=%s\n' "$version" "$new" > .coldigniter-version
          rm -rf _framework

          {
            echo "Updates \`system/\` to ColdIgniter $version (\`$FRAMEWORK_REF\`, commit $new)."
            echo
            echo "Before: commit $old."
            echo
            if [ "$compared" = no ]; then
              echo "The workflow could not compare with the commit before. Check \`app/\`, \`public/\` and \`env\` against ColdIgniter by hand."
            elif [ -n "$starter" ]; then
              echo "These files of the starter application changed in ColdIgniter. The site has its own copies, so look at each one and merge by hand:"
              echo
              printf '%s\n' "$starter" | sed 's/^/- `/; s/$/`/'
            else
              echo "No file of the starter application (\`app/\`, \`public/\`, \`env\`) changed in ColdIgniter."
            fi
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore: update the framework to coldigniter $version"
          git push -u origin "$branch"
          # An organization can forbid workflows to open pull requests. Then
          # the branch is still there: the summary of the run gives the link
          # that opens the pull request by hand.
          if gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "chore: update the framework to coldigniter $version" \
            --body-file "$RUNNER_TEMP/body.md"; then
            exit 0
          fi
          echo "::warning::could not open the pull request, see the summary of the run"
          {
            echo "The workflow could not open the pull request. Open it here:"
            echo
            echo "$compare"
            echo
            cat "$RUNNER_TEMP/body.md"
          } >> "$GITHUB_STEP_SUMMARY"
